# Dependabot configuration. See docs/DEPENDENCY-PINNING.md for the pinning policy.
version: 2
updates:
  # npm/pnpm: the root manifest and lockfile, plus each workspace package.
  # Each directory is listed explicitly so every manifest is checked, not only the root.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/backend"
      - "/apps/frontend"
      - "/packages/eslint-config"
      - "/packages/shared"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
