name: Skilled cryptographically verified OIDC core
on:
  pull_request:
    paths:
      - 'apps/backend/prisma/schema.prisma'
      - 'apps/backend/prisma/migrations/20261109160000_skilled_oidc_state/**'
      - 'apps/backend/src/modules/auth/central-oidc-*.ts'
      - 'apps/backend/src/tests/central-oidc-*.test.ts'
      - '.github/workflows/skilled-central-verified-core.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/prisma/schema.prisma'
      - 'apps/backend/src/modules/auth/central-oidc-*.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate and validate Prisma
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/skilled_schema_only
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Test cryptographic verifier and browser integration
        working-directory: apps/backend
        run: pnpm exec vitest run src/tests/central-oidc-*.test.ts src/tests/central-session-http.test.ts src/tests/central-account-resolution.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
