name: skilled-accessibility-route-verification
on:
  pull_request:
    paths:
      - 'apps/frontend/src/**'
      - 'apps/frontend/scripts/test-skip-navigation-contract.mjs'
      - '.github/workflows/skilled-accessibility-route-verification.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/frontend/src/**'
      - 'apps/frontend/scripts/test-skip-navigation-contract.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-pnpm: "false"
          cache: "false"
      - run: node apps/frontend/scripts/test-skip-navigation-contract.mjs
  frontend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm
      - name: Install frozen lockfile
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Check frontend lint and build
        working-directory: apps/frontend
        run: |
          pnpm lint
          pnpm build
