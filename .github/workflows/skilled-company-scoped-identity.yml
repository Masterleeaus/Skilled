name: skilled-company-scoped-identity-verification

on:
  pull_request:
    paths:
      - 'apps/backend/src/modules/curriculum/integration.routes.ts'
      - 'apps/backend/src/modules/curriculum/integration-identity-policy.ts'
      - 'apps/backend/src/tests/scoped-identity-policy.test.ts'
      - 'apps/backend/src/tests/fixtures/scoped-identity/**'
      - '.github/workflows/skilled-company-scoped-identity.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/src/modules/curriculum/integration.routes.ts'
      - 'apps/backend/src/modules/curriculum/integration-identity-policy.ts'
      - 'apps/backend/src/tests/scoped-identity-policy.test.ts'
      - 'apps/backend/src/tests/fixtures/scoped-identity/**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  scoped-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm
      - name: Install frozen workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma model client
        working-directory: apps/backend
        run: pnpm exec prisma generate
      - name: Exercise scoped identity policy and API contract
        working-directory: apps/backend
        run: |
          pnpm exec vitest run src/tests/scoped-identity-policy.test.ts src/tests/verify-aca-016-identity-read-path.test.ts src/tests/verify-external-identity.test.ts
      - name: Backend TypeScript check
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
