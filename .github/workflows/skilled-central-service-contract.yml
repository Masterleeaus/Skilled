name: Skilled Central authenticated service decision contract
on:
  pull_request:
    paths:
      - 'apps/backend/src/modules/auth/central-decision-transport.ts'
      - 'apps/backend/src/modules/auth/central-service-*.ts'
      - 'apps/backend/src/modules/auth/central-organisation-*.ts'
      - 'apps/backend/src/tests/central-service-*.test.ts'
      - '.github/workflows/skilled-central-service-contract.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/src/modules/auth/central-decision-transport.ts'
      - 'apps/backend/src/modules/auth/central-service-*.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-central-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency installation
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and validate schema
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/skilled_schema_only
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Test scoped Central decision service and existing transport
        working-directory: apps/backend
        run: pnpm exec vitest run src/tests/central-service-*.test.ts src/tests/central-decision-transport-*.test.ts src/tests/central-runtime-*.test.ts
      - name: TypeScript backend
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
