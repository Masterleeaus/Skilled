name: skilled-account-ui-and-email-contracts
on:
  pull_request:
    paths:
      - 'apps/frontend/src/components/Topbar.tsx'
      - 'apps/frontend/src/lib/dashboard-link.ts'
      - 'apps/backend/src/jobs/**'
      - 'apps/backend/src/tests/account-email-content.test.ts'
      - 'scripts/test-public-topbar-navigation.mjs'
      - 'scripts/test-skilled-route-metadata.mjs'
      - '.github/workflows/skilled-account-ui-and-email-contracts.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/frontend/src/components/Topbar.tsx'
      - 'apps/frontend/src/lib/dashboard-link.ts'
      - 'apps/backend/src/jobs/**'
      - 'apps/backend/src/tests/account-email-content.test.ts'
      - 'scripts/test-public-topbar-navigation.mjs'
      - 'scripts/test-skilled-route-metadata.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-pnpm: "false"
          cache: "false"
      - working-directory: .
        run: |
          node --test scripts/test-public-topbar-navigation.mjs
          node scripts/test-skilled-route-metadata.mjs
  build-and-email-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm
      - working-directory: .
        run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: |
          pnpm exec prisma generate
          pnpm exec vitest run src/tests/account-email-content.test.ts
          pnpm exec tsc --noEmit
      - working-directory: apps/frontend
        run: |
          pnpm lint
          pnpm build
