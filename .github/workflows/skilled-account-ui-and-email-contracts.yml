name: skilled-account-ui-and-email-contracts
on:
  pull_request:
    paths:
      - 'lms-main/apps/frontend/src/components/Topbar.tsx'
      - 'lms-main/apps/frontend/src/lib/dashboard-link.ts'
      - 'lms-main/apps/backend/src/jobs/**'
      - 'lms-main/apps/backend/src/tests/account-email-content.test.ts'
      - 'lms-main/scripts/test-public-topbar-navigation.mjs'
      - 'lms-main/scripts/test-skilled-route-metadata.mjs'
      - '.github/workflows/skilled-account-ui-and-email-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'lms-main/apps/frontend/src/components/Topbar.tsx'
      - 'lms-main/apps/frontend/src/lib/dashboard-link.ts'
      - 'lms-main/apps/backend/src/jobs/**'
      - 'lms-main/apps/backend/src/tests/account-email-content.test.ts'
      - 'lms-main/scripts/test-public-topbar-navigation.mjs'
      - 'lms-main/scripts/test-skilled-route-metadata.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: lms-main
        run: |
          node --test scripts/test-public-topbar-navigation.mjs
          node scripts/test-skilled-route-metadata.mjs
  build-and-email-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lms-main/pnpm-lock.yaml
      - working-directory: lms-main
        run: pnpm install --frozen-lockfile
      - working-directory: lms-main/apps/backend
        run: |
          pnpm exec prisma generate
          pnpm exec vitest run src/tests/account-email-content.test.ts
          pnpm exec tsc --noEmit
      - working-directory: lms-main/apps/frontend
        run: |
          pnpm lint
          pnpm build
