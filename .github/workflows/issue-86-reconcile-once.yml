# One-shot branch-only reconciliation for issue #86. Remove this workflow after use.
name: issue-86-reconcile-index-once
on:
  push:
    branches:
      - fix/issue-86-curriculum-brand-audit
    paths:
      - .github/workflows/issue-86-reconcile-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild derived index from canonical content
        working-directory: lms-main
        run: node scripts/reconcile-lesson-formats.mjs
      - name: Commit derived index to isolated issue branch (no publication)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lms-main/curriculum/lesson-normalization-index.json
          if git diff --cached --quiet; then
            echo "Derived index already in sync"
            exit 0
          fi
          git commit -m "chore(curriculum): regenerate issue 86 derived lesson index"
          git push origin HEAD:refs/heads/fix/issue-86-curriculum-brand-audit
