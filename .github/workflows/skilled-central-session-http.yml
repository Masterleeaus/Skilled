name: Skilled Central session HTTP boundary

on:
  pull_request:
    paths:
      - 'apps/backend/src/modules/auth/central-session-*.ts'
      - 'apps/backend/src/modules/auth/central-verified-handoff.ts'
      - 'apps/backend/src/tests/central-session-http.test.ts'
      - 'apps/backend/src/tests/fixtures/central-session-http/**'
      - '.github/workflows/skilled-central-session-http.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/src/modules/auth/central-session-*.ts'
      - 'apps/backend/src/modules/auth/central-verified-handoff.ts'
      - 'apps/backend/src/tests/central-session-http.test.ts'
      - 'apps/backend/src/tests/fixtures/central-session-http/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma and validate schema
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/skilled_schema_only
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Test Central HTTP, session store and company lifecycle
        working-directory: apps/backend
        run: pnpm exec vitest run src/tests/central-session-http.test.ts src/tests/central-session-store.test.ts src/tests/central-company-provisioning.test.ts
      - name: Typecheck backend
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
