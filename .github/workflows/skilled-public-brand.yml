name: skilled-public-brand
on:
  pull_request:
    paths:
      - "lms-main/apps/frontend/src/app/layout.tsx"
      - "lms-main/scripts/test-skilled-public-brand.mjs"
      - "lms-main/scripts/prepare-public-assets.mjs"
      - "lms-main/scripts/test-prepare-public-assets.mjs"
      - "lms-main/apps/frontend/package.json"
      - ".github/workflows/skilled-public-brand.yml"
  push:
    branches:
      - main
    paths:
      - "lms-main/apps/frontend/src/app/layout.tsx"
      - "lms-main/scripts/test-skilled-public-brand.mjs"
      - ".github/workflows/skilled-public-brand.yml"
permissions:
  contents: read
jobs:
  public-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical asset preparation behavior
        working-directory: lms-main
        run: node --test scripts/test-prepare-public-assets.mjs

      - name: Materialise tracked images and verify output parity
        working-directory: lms-main
        run: |
          node scripts/prepare-public-assets.mjs
          node scripts/prepare-public-assets.mjs --check

      - name: Validate public product metadata contract
        working-directory: lms-main
        run: node --test scripts/test-skilled-public-brand.mjs
