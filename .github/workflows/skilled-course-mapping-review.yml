name: skilled-course-mapping-review
on:
  pull_request:
    paths:
      - "lms-main/curriculum/shared/app/SFS-*.json"
      - "lms-main/curriculum/reviews/course-mapping/**"
      - "lms-main/scripts/audit-course-mapping-review.mjs"
      - "lms-main/scripts/test-audit-course-mapping-review.mjs"
      - ".github/workflows/skilled-course-mapping-review.yml"
  push:
    branches: [main]
    paths:
      - "lms-main/curriculum/shared/app/SFS-*.json"
      - "lms-main/curriculum/reviews/course-mapping/**"
      - "lms-main/scripts/audit-course-mapping-review.mjs"
      - "lms-main/scripts/test-audit-course-mapping-review.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run reviewer evidence regression tests
        working-directory: lms-main
        run: node --test scripts/test-audit-course-mapping-review.mjs
      - name: Validate all 16 source-linked review records
        working-directory: lms-main
        run: node scripts/audit-course-mapping-review.mjs --report build/course-mapping-review-audit.json
      - name: Preserve item-level report even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilled-course-mapping-review
          path: lms-main/build/course-mapping-review-audit.json
          retention-days: 30
          if-no-files-found: warn
