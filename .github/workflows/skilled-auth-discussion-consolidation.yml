name: skilled-auth-discussion-consolidation
on:
  pull_request:
    paths:
      - 'lms-main/apps/frontend/src/app/(auth)/**'
      - 'lms-main/apps/frontend/src/app/student/courses/**'
      - 'lms-main/apps/frontend/src/app/teacher/courses/**'
      - 'lms-main/apps/frontend/src/components/AuthBrand.tsx'
      - 'lms-main/apps/frontend/src/components/DiscussionThreadDetail.tsx'
      - 'lms-main/scripts/test-account-flow-branding.mjs'
      - 'lms-main/scripts/test-active-source-consolidation.mjs'
      - 'lms-main/scripts/audit-public-product-identity.mjs'
      - 'lms-main/scripts/test-audit-public-product-identity.mjs'
      - 'lms-main/scripts/test-skilled-public-brand.mjs'
      - 'lms-main/scripts/test-deployment-doc-contract.mjs'
      - 'lms-main/docs/**'
      - '.github/workflows/skilled-auth-discussion-consolidation.yml'
  push:
    branches: [main]
    paths:
      - 'lms-main/apps/frontend/src/**'
      - 'lms-main/scripts/test-account-flow-branding.mjs'
      - 'lms-main/scripts/test-active-source-consolidation.mjs'
      - 'lms-main/scripts/audit-public-product-identity.mjs'
      - 'lms-main/scripts/test-audit-public-product-identity.mjs'
      - 'lms-main/scripts/test-skilled-public-brand.mjs'
      - 'lms-main/scripts/test-deployment-doc-contract.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: lms-main
        run: |
          node --test scripts/test-account-flow-branding.mjs
          node --test scripts/test-active-source-consolidation.mjs
          node --test scripts/test-audit-public-product-identity.mjs
          node --test scripts/test-skilled-public-brand.mjs
          node --test scripts/test-deployment-doc-contract.mjs
          node scripts/audit-public-product-identity.mjs --strict
  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lms-main/pnpm-lock.yaml
      - working-directory: lms-main
        run: pnpm install --frozen-lockfile
      - working-directory: lms-main/apps/frontend
        run: |
          pnpm lint
          pnpm build
