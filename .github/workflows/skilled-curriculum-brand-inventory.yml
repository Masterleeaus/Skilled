name: skilled-curriculum-brand-inventory
on:
  pull_request:
    paths:
      - 'scripts/audit-curriculum-brand.mjs'
      - 'scripts/test-audit-curriculum-brand.mjs'
      - 'scripts/test-curriculum-brand-fixtures.mjs'
      - 'tests/fixtures/curriculum-brand/**'
      - 'curriculum/courses/**'
      - 'curriculum/shared/**'
      - 'curriculum/structure/**'
      - '.github/workflows/skilled-curriculum-brand-inventory.yml'
  push:
    branches: [Main, main]
    paths:
      - 'scripts/audit-curriculum-brand.mjs'
      - 'scripts/test-audit-curriculum-brand.mjs'
      - 'scripts/test-curriculum-brand-fixtures.mjs'
      - 'tests/fixtures/curriculum-brand/**'
      - 'curriculum/courses/**'
      - 'curriculum/shared/**'
      - 'curriculum/structure/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate classification and source-location contracts
        working-directory: .
        run: |
          node --test scripts/test-audit-curriculum-brand.mjs
          node --test scripts/test-curriculum-brand-fixtures.mjs
      - name: Produce read-only canonical curriculum brand evidence
        working-directory: .
        run: node scripts/audit-curriculum-brand.mjs --report build/issue-86-brand-inventory.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-86-brand-inventory
          path: build/issue-86-brand-inventory.json
          if-no-files-found: warn
