# Dependency-free contract protects the path filter on curriculum-ci.
name: curriculum-ci-trigger-contract
on:
  pull_request:
    paths:
      - ".github/workflows/curriculum-ci.yml"
      - ".github/workflows/curriculum-ci-trigger-contract.yml"
      - "scripts/test-curriculum-ci-trigger-contract.mjs"
      - "package.json"
  push:
    branches: [Main, main]
    paths:
      - ".github/workflows/curriculum-ci.yml"
      - ".github/workflows/curriculum-ci-trigger-contract.yml"
      - "scripts/test-curriculum-ci-trigger-contract.mjs"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-pnpm: "false"
          cache: "false"
      - name: Assert all curriculum publication surfaces activate CI
        run: node --test scripts/test-curriculum-ci-trigger-contract.mjs
