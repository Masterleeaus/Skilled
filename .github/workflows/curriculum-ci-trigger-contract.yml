# Dependency-free contract protects the path filter on curriculum-ci.
name: curriculum-ci-trigger-contract
on:
  pull_request:
    paths:
      - ".github/workflows/curriculum-ci.yml"
      - ".github/workflows/curriculum-ci-trigger-contract.yml"
      - "lms-main/scripts/test-curriculum-ci-trigger-contract.mjs"
      - "lms-main/package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/curriculum-ci.yml"
      - ".github/workflows/curriculum-ci-trigger-contract.yml"
      - "lms-main/scripts/test-curriculum-ci-trigger-contract.mjs"
      - "lms-main/package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert all curriculum publication surfaces activate CI
        run: node --test lms-main/scripts/test-curriculum-ci-trigger-contract.mjs
