name: Skilled verified Central completion
on:
  pull_request:
    paths:
      - 'apps/backend/src/modules/auth/central-verified-completion.ts'
      - 'apps/backend/src/tests/central-verified-completion*'
      - 'apps/backend/tsconfig.central-completion.json'
      - '.github/workflows/skilled-central-verified-completion.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/src/modules/auth/central-verified-completion.ts'
      - 'apps/backend/src/tests/central-verified-completion*'
      - 'apps/backend/tsconfig.central-completion.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://testing:testing@localhost:5432/lms_test
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-test-access-secret-only-not-real
      JWT_REFRESH_SECRET: ci-test-refresh-secret-only-not-real
      CLIENT_URL: http://localhost:3000
      MINIO_ACCESS_KEY: test-minio
      MINIO_SECRET_KEY: ci-test-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate
      - name: Run trusted completion fail-closed suite
        working-directory: apps/backend
        run: pnpm exec vitest run src/tests/central-verified-completion-*.test.ts
      - name: Typecheck backend and completion contract
        working-directory: apps/backend
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc --project tsconfig.central-completion.json
