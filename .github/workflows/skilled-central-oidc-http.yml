name: Skilled verified OIDC HTTP handoff
on:
  pull_request:
    paths:
      - 'apps/backend/src/modules/auth/central-oidc-*.ts'
      - 'apps/backend/src/tests/central-oidc-*.test.ts'
      - 'apps/backend/src/tests/support/central-oidc-http-harness.ts'
      - '.github/workflows/skilled-central-oidc-http.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/src/modules/auth/central-oidc-*.ts'
      - 'apps/backend/src/tests/central-oidc-*.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-oidc-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm
      - name: Install frozen dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma and generate client
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/skilled_schema_only
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Exercise OIDC callback bridge and existing verified session behavior
        working-directory: apps/backend
        run: |
          pnpm exec vitest run src/tests/central-oidc-*.test.ts src/tests/central-session-http.test.ts src/tests/central-account-resolution.test.ts
      - name: Typecheck backend
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
