name: Skilled Central account-resolution contract

on:
  pull_request:
    paths:
      - 'apps/backend/src/modules/auth/central-account-resolution.ts'
      - 'apps/backend/src/tests/central-account-resolution.test.ts'
      - 'apps/backend/src/tests/fixtures/central-account-resolution/**'
      - '.github/workflows/skilled-central-account-contract.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/src/modules/auth/central-account-resolution.ts'
      - 'apps/backend/src/tests/central-account-resolution.test.ts'
      - 'apps/backend/src/tests/fixtures/central-account-resolution/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-local-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm
      - name: Frozen dependency installation
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        working-directory: apps/backend
        run: pnpm exec prisma generate
      - name: Verify Central account and existing scope rules
        working-directory: apps/backend
        run: |
          pnpm exec vitest run src/tests/central-account-resolution.test.ts src/tests/scoped-identity-policy.test.ts src/tests/verify-external-identity.test.ts
      - name: Backend TypeScript check
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
