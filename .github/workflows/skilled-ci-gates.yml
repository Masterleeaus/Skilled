# Required CI gates for the SkilledAt.Work academy backend and contract scripts (issue #149).
# Runs on every pull request and on pushes to Main or main, with no path filter, so these gates
# cannot be skipped by a change that touches none of the listed paths. Any failing step
# fails the check. The repository root is the parent of , so each job sets
# working-directory to the repository root.
name: skilled-ci-gates

on:
  pull_request:
  push:
    branches:
      - Main
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skilled-ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-scripts:
    name: Contract scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate ESLint 10 workspace and lockfile contract (issue #303)
        run: node --test scripts/test-eslint-workspace-contract.mjs

      - name: Lint backend and frontend with shared config
        run: pnpm run lint

      - name: Auth route contracts
        run: node scripts/test-auth-route-contracts.mjs

      - name: Session lifecycle contract
        run: node scripts/test-session-lifecycle-contract.mjs

      - name: Payment security contract
        run: node scripts/test-payment-security-contract.mjs

      - name: Course publication access
        run: node scripts/test-course-publication-access.mjs

      - name: Video upload safety
        run: node scripts/test-video-upload-safety.mjs

      - name: Local development env template and README contract
        run: node --test scripts/test-local-install-env-contract.mjs

      - name: Production environment template coverage
        run: node scripts/test-env-template-contract.mjs

      - name: Deployment documentation contract
        run: node --test scripts/test-deployment-doc-contract.mjs

  academy-backend-gates:
    name: Academy backend gates and test typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: Academy backend tests
        run: pnpm test:academy:backend

      - name: Typecheck backend tests
        run: pnpm --filter @lms/backend run typecheck:tests

  backend-vitest:
    name: Backend vitest (with PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skilled_tenant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skilled_tenant_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skilled_tenant_ci
      # Enables the real PostgreSQL central-session tests, which throw without it.
      SKILLED_CENTRAL_SESSION_PG_TEST: "1"
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Provision disposable PostgreSQL database from Prisma schema
        working-directory: apps/backend
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
          pnpm exec prisma db push

      - name: Full backend vitest run
        run: pnpm --filter @lms/backend exec vitest run
