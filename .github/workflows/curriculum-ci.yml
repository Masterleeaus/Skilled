# Curriculum quality gate for Skilled.
# The application workspace lives at the repository root. Runs `pnpm curriculum:ci` (scripts/ci-curriculum-audit.mjs
# with --fail-on-blocked). It does not approve or change any curriculum content.
name: curriculum-ci

on:
  pull_request:
    paths:
      - "curriculum/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/curriculum-ci.yml"
  push:
    branches:
      - main
    paths:
      - "curriculum/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/curriculum-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculum-ci:
    name: Curriculum quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run curriculum CI gate
        run: pnpm curriculum:ci

      - name: Upload curriculum CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-ci-report
          path: build/curriculum-ci-report.json
          if-no-files-found: warn
          retention-days: 14
