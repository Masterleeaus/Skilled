# Curriculum quality gate for SkilledAt.Work.
# The Git repository root is the parent of , so this workflow lives here and
# sets working-directory to the repository root. The blocking step runs scripts/ci-curriculum-audit.mjs
# (structure, index drift, ratchet, self-tests). It does not approve or change any curriculum content.
name: curriculum-ci

on:
  pull_request:
    paths:
      - "curriculum/**"
      - "scripts/**"
      - "tests/fixtures/assessment-malformed/**"
      - "tests/fixtures/assessment-publication/**"
      - "apps/backend/src/modules/curriculum/**"
      - "apps/backend/src/modules/courses/**"
      - "apps/backend/src/modules/quizzes/**"
      - "apps/backend/src/tests/**"
      - "apps/backend/prisma/**"
      - "package.json"
      - ".github/workflows/skilled-assessment-negative-fixtures.yml"
      - ".github/workflows/curriculum-ci.yml"
      - ".github/workflows/curriculum-ci-trigger-contract.yml"
  push:
    branches:
      - main
      - Main
    paths:
      - "curriculum/**"
      - "scripts/**"
      - "tests/fixtures/assessment-malformed/**"
      - "tests/fixtures/assessment-publication/**"
      - "apps/backend/src/modules/curriculum/**"
      - "apps/backend/src/modules/courses/**"
      - "apps/backend/src/modules/quizzes/**"
      - "apps/backend/src/tests/**"
      - "apps/backend/prisma/**"
      - "package.json"
      - ".github/workflows/skilled-assessment-negative-fixtures.yml"
      - ".github/workflows/curriculum-ci.yml"
      - ".github/workflows/curriculum-ci-trigger-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculum-ci:
    name: Curriculum quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22 and pnpm 10
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify all publishing-sensitive changes trigger CI
        run: node --test scripts/test-curriculum-ci-trigger-contract.mjs

      - name: Verify all malformed assessment fixtures fail closed
        run: node scripts/test-assessment-publication-negative-fixtures.mjs

      # Blocking (issue #26): structure, normalisation index drift, the known-gap ratchet and
      # self-tests fail the check. The 1267 assessments still blocked by missing human approvals
      # are NOT part of this step (see the informational step below) so main stays green until
      # reviewers record approvals. Known blocked fixtures must fail this gate (next step).
      - name: Run curriculum CI gate
        run: node scripts/ci-curriculum-audit.mjs --report build/curriculum-ci-report.json

      - name: Verify known blocked curriculum fixtures fail the gate
        run: node --test scripts/test-curriculum-ci-fixture-gate.mjs

      # Informational: the strict `pnpm curriculum:ci` (--fail-on-blocked) fails while assessments
      # lack matching human approval records. Remove continue-on-error once every assessment is
      # approved (owner decision, recorded under "Decisions" in the PR).
      - name: Report assessments blocked from publication (strict, informational)
        continue-on-error: true
        run: pnpm curriculum:ci

      - name: Upload curriculum CI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curriculum-ci-report
          path: build/curriculum-ci-report.json
          if-no-files-found: warn
          retention-days: 14
