name: skilled-route-brand-verification
on:
  pull_request:
    paths:
      - 'apps/frontend/src/**'
      - 'apps/backend/src/jobs/email.queue.ts'
      - 'scripts/test-skilled-route-metadata.mjs'
      - '.github/workflows/skilled-route-brand-verification.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/frontend/src/**'
      - 'apps/backend/src/jobs/email.queue.ts'
      - 'scripts/test-skilled-route-metadata.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert 22 private route layouts and branded public/email copy
        working-directory: .
        run: node scripts/test-skilled-route-metadata.mjs
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Validate frontend lint and build
        working-directory: apps/frontend
        run: |
          pnpm lint
          pnpm build
      - name: Generate Prisma client and validate backend TypeScript
        working-directory: apps/backend
        run: |
          pnpm exec prisma generate
          pnpm exec tsc --noEmit
