name: Skilled Central revocable session contract
on:
  pull_request:
    paths:
      - 'apps/backend/prisma/schema.prisma'
      - 'apps/backend/prisma/migrations/20261109150000_skilled_central_sessions/**'
      - 'apps/backend/src/modules/auth/central-session-store.ts'
      - 'apps/backend/src/tests/central-session-store.test.ts'
      - 'apps/backend/src/tests/fixtures/central-sessions/**'
      - '.github/workflows/skilled-central-sessions.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/backend/prisma/schema.prisma'
      - 'apps/backend/prisma/migrations/20261109150000_skilled_central_sessions/**'
      - 'apps/backend/src/modules/auth/central-session-store.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  central-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Validate schema and generate types
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/skilled_schema_only
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Test session lifecycle and Central identity contracts
        working-directory: apps/backend
        run: pnpm exec vitest run src/tests/central-session-store.test.ts src/tests/central-company-provisioning.test.ts src/tests/central-account-resolution.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
