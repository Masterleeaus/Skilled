<svg viewBox="0 0 1320 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1320" height="820" fill="#0f172a"/>
  <text x="660" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">LMS — Entity Relationship Diagram (simplified)</text>
  <text x="660" y="54" text-anchor="middle" font-size="12" fill="#64748b">Full field-level schema: apps/backend/prisma/schema.prisma</text>

  <!-- ============ helper: box template values ============ -->
  <!-- col0 x=40  col1 x=360  col2 x=680  col3 x=1000 -->
  <!-- row0 y=80  row1 y=250  row2 y=420  row3 y=590  -->

  <!-- COL 0 : Identity / Platform -->
  <g>
    <rect x="40" y="80" width="280" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">User</text>
    <line x1="55" y1="115" x2="305" y2="115" stroke="#334155"/>
    <text x="55" y="134" font-size="11" fill="#94a3b8">id, email, passwordHash</text>
    <text x="55" y="151" font-size="11" fill="#94a3b8">role: ADMIN | TEACHER | STUDENT</text>
    <text x="55" y="168" font-size="11" fill="#94a3b8">fullName, isActive, isEmailVerified</text>
    <text x="55" y="185" font-size="11" fill="#94a3b8">deletedAt, createdAt</text>
  </g>

  <g>
    <rect x="40" y="250" width="280" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="180" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">RefreshToken</text>
    <line x1="55" y1="283" x2="305" y2="283" stroke="#334155"/>
    <text x="55" y="302" font-size="11" fill="#94a3b8">userId, tokenHash, deviceInfo</text>
    <text x="55" y="319" font-size="11" fill="#94a3b8">isRevoked, expiresAt</text>
  </g>

  <g>
    <rect x="40" y="420" width="280" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="180" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">AuditLog</text>
    <line x1="55" y1="453" x2="305" y2="453" stroke="#334155"/>
    <text x="55" y="472" font-size="11" fill="#94a3b8">userId, action, entity, entityId</text>
    <text x="55" y="489" font-size="11" fill="#94a3b8">oldValue, newValue (JSON), createdAt</text>
  </g>

  <g>
    <rect x="40" y="590" width="280" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="180" y="613" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Notification</text>
    <line x1="55" y1="623" x2="305" y2="623" stroke="#334155"/>
    <text x="55" y="642" font-size="11" fill="#94a3b8">userId, title, message, type</text>
    <text x="55" y="659" font-size="11" fill="#94a3b8">isRead, createdAt</text>
  </g>

  <!-- COL 1 : Catalog -->
  <g>
    <rect x="360" y="80" width="280" height="90" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Category</text>
    <line x1="375" y1="113" x2="625" y2="113" stroke="#334155"/>
    <text x="375" y="132" font-size="11" fill="#94a3b8">id, name, slug, parentId (self-ref)</text>
  </g>

  <g>
    <rect x="360" y="250" width="280" height="130" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="500" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Course</text>
    <line x1="375" y1="285" x2="625" y2="285" stroke="#334155"/>
    <text x="375" y="304" font-size="11" fill="#94a3b8">id, title, slug, description</text>
    <text x="375" y="321" font-size="11" fill="#94a3b8">teacherId → User, categoryId → Category</text>
    <text x="375" y="338" font-size="11" fill="#94a3b8">price, level, isPublished</text>
    <text x="375" y="355" font-size="11" fill="#94a3b8">deletedAt, createdAt</text>
  </g>

  <g>
    <rect x="360" y="420" width="280" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="500" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Module</text>
    <line x1="375" y1="453" x2="625" y2="453" stroke="#334155"/>
    <text x="375" y="472" font-size="11" fill="#94a3b8">id, courseId → Course</text>
    <text x="375" y="489" font-size="11" fill="#94a3b8">title, orderIndex</text>
  </g>

  <g>
    <rect x="360" y="590" width="280" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="500" y="613" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Lesson</text>
    <line x1="375" y1="623" x2="625" y2="623" stroke="#334155"/>
    <text x="375" y="642" font-size="11" fill="#94a3b8">id, moduleId → Module, videoUrl</text>
    <text x="375" y="659" font-size="11" fill="#94a3b8">isFreePreview, orderIndex, duration</text>
  </g>

  <!-- COL 2 : Learning activity -->
  <g>
    <rect x="680" y="80" width="280" height="90" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="820" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Enrollment</text>
    <line x1="695" y1="113" x2="945" y2="113" stroke="#334155"/>
    <text x="695" y="132" font-size="11" fill="#94a3b8">studentId → User, courseId → Course</text>
    <text x="695" y="149" font-size="11" fill="#94a3b8">progressPercentage, status</text>
  </g>

  <g>
    <rect x="680" y="250" width="280" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="820" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">LessonProgress</text>
    <line x1="695" y1="283" x2="945" y2="283" stroke="#334155"/>
    <text x="695" y="302" font-size="11" fill="#94a3b8">studentId, lessonId → Lesson</text>
    <text x="695" y="319" font-size="11" fill="#94a3b8">watchedSeconds, completed</text>
  </g>

  <g>
    <rect x="680" y="420" width="280" height="90" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="820" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Quiz → Question → Option</text>
    <line x1="695" y1="453" x2="945" y2="453" stroke="#334155"/>
    <text x="695" y="472" font-size="11" fill="#94a3b8">courseId → Course, totalMarks</text>
    <text x="695" y="489" font-size="11" fill="#94a3b8">questions[] with options[] (isCorrect)</text>
  </g>

  <g>
    <rect x="680" y="590" width="280" height="90" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="820" y="613" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">QuizAttempt → Answer</text>
    <line x1="695" y1="623" x2="945" y2="623" stroke="#334155"/>
    <text x="695" y="642" font-size="11" fill="#94a3b8">studentId, quizId, marksObtained</text>
    <text x="695" y="659" font-size="11" fill="#94a3b8">answers[]: selectedOptionId / textAnswer</text>
  </g>

  <!-- COL 3 : Assessment / engagement -->
  <g>
    <rect x="1000" y="80" width="280" height="90" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="1140" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Assignment → Submission</text>
    <line x1="1015" y1="113" x2="1265" y2="113" stroke="#334155"/>
    <text x="1015" y="132" font-size="11" fill="#94a3b8">courseId, dueDate, totalMarks</text>
    <text x="1015" y="149" font-size="11" fill="#94a3b8">submissions[]: attachments, marksObtained</text>
  </g>

  <g>
    <rect x="1000" y="250" width="280" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1140" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">LiveClass → Attendance</text>
    <line x1="1015" y1="283" x2="1265" y2="283" stroke="#334155"/>
    <text x="1015" y="302" font-size="11" fill="#94a3b8">courseId, scheduledAt, status</text>
    <text x="1015" y="319" font-size="11" fill="#94a3b8">attendance[]: studentId, status</text>
  </g>

  <g>
    <rect x="1000" y="420" width="280" height="90" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="1140" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Certificate · Review</text>
    <line x1="1015" y1="453" x2="1265" y2="453" stroke="#334155"/>
    <text x="1015" y="472" font-size="11" fill="#94a3b8">certificateNumber, pdfUrl, issuedAt</text>
    <text x="1015" y="489" font-size="11" fill="#94a3b8">rating, comment (per course/student)</text>
  </g>

  <g>
    <rect x="1000" y="590" width="280" height="90" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="1140" y="613" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Payment · Coupon · Discussion</text>
    <line x1="1015" y1="623" x2="1265" y2="623" stroke="#334155"/>
    <text x="1015" y="642" font-size="11" fill="#94a3b8">amount, provider, status</text>
    <text x="1015" y="659" font-size="11" fill="#94a3b8">DiscussionThread → DiscussionReply</text>
  </g>

  <!-- ============ relationships ============ -->
  <!-- User -->
  <path d="M320,145 C 340,145 340,285 360,300" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M180,210 L180,250" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M180,340 L180,420" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M180,510 L180,590" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M320,150 C 500,150 700,125 680,125" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Category -> Course -->
  <path d="M500,170 L500,250" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Course -> Module -->
  <path d="M500,380 L500,420" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Module -> Lesson -->
  <path d="M500,510 L500,590" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Course -> Enrollment -->
  <path d="M640,290 C 660,270 660,150 680,140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Enrollment -> LessonProgress -->
  <path d="M820,170 L820,250" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Course -> Quiz -->
  <path d="M640,320 C 660,350 660,440 680,455" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Quiz -> QuizAttempt -->
  <path d="M820,510 L820,590" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Course -> Assignment -->
  <path d="M640,270 C 850,180 900,125 1000,125" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Course -> LiveClass -->
  <path d="M640,300 C 900,300 950,295 1000,295" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Course -> Certificate/Review -->
  <path d="M640,340 C 900,400 950,460 1000,465" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Course -> Payment/Discussion -->
  <path d="M640,360 C 900,500 950,630 1000,635" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="660" y="800" text-anchor="middle" font-size="11" fill="#475569">Combined boxes (e.g. "Quiz → Question → Option") represent 1-to-many chains collapsed for readability</text>
</svg>
