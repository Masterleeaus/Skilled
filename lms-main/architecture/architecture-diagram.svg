<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#0f172a"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">LMS — System Architecture</text>

  <!-- Client -->
  <rect x="380" y="70" width="240" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">Browser</text>
  <text x="500" y="115" text-anchor="middle" font-size="12" fill="#94a3b8">Next.js 15 (App Router)</text>

  <!-- arrow to API -->
  <line x1="500" y1="130" x2="500" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Express API -->
  <rect x="350" y="185" width="300" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">Express REST API</text>
  <text x="500" y="235" text-anchor="middle" font-size="12" fill="#94a3b8">TypeScript · Zod validation · JWT auth</text>

  <!-- API connections down to services -->
  <line x1="420" y1="255" x2="180" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="255" x2="330" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="255" x2="500" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="255" x2="670" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="255" x2="830" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="90" y="335" width="180" height="65" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="180" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">PostgreSQL</text>
  <text x="180" y="380" text-anchor="middle" font-size="11" fill="#94a3b8">via Prisma ORM</text>

  <!-- Redis -->
  <rect x="290" y="335" width="180" height="65" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="380" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Redis</text>
  <text x="380" y="380" text-anchor="middle" font-size="11" fill="#94a3b8">Cache · sessions · BullMQ</text>

  <!-- MinIO -->
  <rect x="410" y="335" width="180" height="65" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="500" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">MinIO</text>
  <text x="500" y="380" text-anchor="middle" font-size="11" fill="#94a3b8">S3-compatible file storage</text>

  <!-- BullMQ Workers -->
  <rect x="580" y="335" width="180" height="65" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="670" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">BullMQ Workers</text>
  <text x="670" y="380" text-anchor="middle" font-size="11" fill="#94a3b8">Email · certificate PDF jobs</text>

  <!-- Stripe -->
  <rect x="740" y="335" width="180" height="65" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="830" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Stripe</text>
  <text x="830" y="380" text-anchor="middle" font-size="11" fill="#94a3b8">Payments (test mode)</text>

  <!-- Worker to Mailhog / MinIO -->
  <line x1="670" y1="400" x2="670" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="465" width="180" height="60" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="670" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Mailhog</text>
  <text x="670" y="510" text-anchor="middle" font-size="11" fill="#94a3b8">Local email testing (dev)</text>

  <line x1="500" y1="400" x2="500" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="410" y="465" width="180" height="60" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="500" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Videos · PDFs</text>
  <text x="500" y="510" text-anchor="middle" font-size="11" fill="#94a3b8">course videos, certificates, files</text>

  <!-- Docker box grouping infra -->
  <rect x="70" y="315" width="870" height="230" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="562" font-size="12" fill="#64748b">Docker Compose: Postgres · Redis · MinIO · Mailhog (local dev infra)</text>

  <text x="500" y="600" text-anchor="middle" font-size="11" fill="#475569">Every API response follows a consistent { success, message, data } envelope</text>
</svg>
