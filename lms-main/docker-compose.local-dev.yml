# LOCAL DEVELOPMENT ONLY. Do NOT run this file on a server or any shared host.
# It uses default credentials (lms/lms, minioadmin/minioadmin), publishes ports
# on all interfaces, and makes the storage bucket anonymously downloadable.
# Server and shared environments must use a separately managed Compose setup
# with secrets supplied from a private env file outside the repository.
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned release tag (not latest). No digest could be resolved from the
    # build sandbox; add an @sha256 digest once verified against the registry.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # Pinned release tag (not latest), taken from the repo's MinIO pin; no digest resolved here.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lms-storage || true &&
      mc anonymous set download local/lms-storage
      "

  mailhog:
    image: mailhog/mailhog:latest
    restart: "no"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
  redis-data:
